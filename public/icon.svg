
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Soft warm shadow under the backpack -->
    <radialGradient id="bottomShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D3B2D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2D3B2D" stop-opacity="0"/>
    </radialGradient>
    <filter id="stickerShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#556B2F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Clean Pure White Background -->
  <rect width="512" height="512" rx="116" fill="#FFFFFF" />

  <!-- Soft Ground Shadow -->
  <ellipse cx="256" cy="445" rx="145" ry="22" fill="url(#bottomShadow)" />

  <g filter="url(#stickerShadow)">
    <!-- White Sticker Outline Effect -->
    <!-- Outer Handle Backing -->
    <path d="M210 110 C210 82 230 62 256 62 C282 62 302 82 302 110 L302 140 L210 140 Z" fill="#FFFFFF" stroke="#E5EAE2" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Top Leather Handle -->
    <path d="M220 115 C220 95 236 78 256 78 C276 78 292 95 292 115 L292 140 L220 140 Z" fill="none" stroke="#C59B63" stroke-width="18" stroke-linecap="round"/>
    <path d="M220 115 C220 95 236 78 256 78 C276 78 292 95 292 115 L292 140 L220 140 Z" fill="none" stroke="#9A7038" stroke-width="4" stroke-linecap="round" stroke-dasharray="6,4"/>

    <!-- Left Shoulder Strap Curved Behind -->
    <path d="M165 180 C110 205 92 310 128 395 C136 414 150 422 165 422" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
    <path d="M165 180 C110 205 92 310 128 395 C136 414 150 422 165 422" fill="none" stroke="#8F9E82" stroke-width="24" stroke-linecap="round"/>
    <path d="M165 180 C110 205 92 310 128 395 C136 414 150 422 165 422" fill="none" stroke="#5E6F52" stroke-width="2" stroke-linecap="round"/>

    <!-- Main Olive Canvas Backpack Body -->
    <path d="M175 145 C150 145 135 170 132 205 L124 370 C120 405 145 430 180 430 L332 430 C367 430 392 405 388 370 L380 205 C377 170 362 145 337 145 Z" fill="#95A488" stroke="#526147" stroke-width="6" />

    <!-- Canvas Texture / Stitches highlights -->
    <path d="M142 360 L148 220 C150 190 162 165 185 160" fill="none" stroke="#B1C0A5" stroke-width="4" stroke-linecap="round"/>

    <!-- Side Left Pocket -->
    <path d="M120 280 C112 280 106 288 108 300 L114 365 C116 376 124 382 135 382 L138 382 L134 280 Z" fill="#88987C" stroke="#526147" stroke-width="5"/>
    <path d="M106 280 C106 273 112 268 120 268 L138 268 L138 285 L106 285 Z" fill="#D3A76C" stroke="#755227" stroke-width="4"/>

    <!-- Side Right Pocket -->
    <path d="M374 280 L378 382 L381 382 C392 382 400 376 402 365 L408 300 C410 288 404 280 396 280 Z" fill="#88987C" stroke="#526147" stroke-width="5"/>
    <path d="M374 268 L396 268 C404 268 410 273 410 280 L374 285 Z" fill="#D3A76C" stroke="#755227" stroke-width="4"/>

    <!-- Main Leather Top Flap / Hood -->
    <path d="M165 155 C165 140 185 132 256 132 C327 132 347 140 347 155 L352 245 C352 265 332 278 312 278 L200 278 C180 278 160 265 160 245 Z" fill="#D9AC72" stroke="#6F4D20" stroke-width="6"/>
    <!-- Top Flap Inner Shade & Texture -->
    <path d="M178 162 C195 150 225 146 256 146 C287 146 317 150 334 162 L338 238 C338 252 324 262 308 262 L204 262 C188 262 174 252 174 238 Z" fill="#C99B60"/>
    
    <!-- Top Leather Patch Label -->
    <rect x="230" y="195" width="52" height="34" rx="6" fill="#B38448" stroke="#5C3B12" stroke-width="4"/>
    <circle cx="238" cy="203" r="2" fill="#5C3B12"/>
    <circle cx="274" cy="203" r="2" fill="#5C3B12"/>
    <circle cx="238" cy="221" r="2" fill="#5C3B12"/>
    <circle cx="274" cy="221" r="2" fill="#5C3B12"/>

    <!-- Front Big Pocket -->
    <rect x="175" y="295" width="162" height="110" rx="20" fill="#88987C" stroke="#526147" stroke-width="6"/>
    <path d="M175 330 L337 330" stroke="#526147" stroke-width="4" stroke-linecap="round"/>
    <rect x="200" y="336" width="112" height="8" rx="4" fill="#C99B60" stroke="#6F4D20" stroke-width="3"/>
    <!-- Zipper Pull Tab -->
    <rect x="210" y="344" width="10" height="18" rx="3" fill="#B38448" stroke="#5C3B12" stroke-width="2"/>
    <circle cx="215" cy="342" r="3" fill="#5C3B12"/>
    <!-- Bottom Right Leather Brand Patch on pocket -->
    <rect x="280" y="365" width="38" height="24" rx="4" fill="#C99B60" stroke="#6F4D20" stroke-width="3"/>

    <!-- Vertical Leather Straps with Buckles -->
    <!-- Left Strap -->
    <rect x="195" y="165" width="22" height="155" rx="8" fill="#C59458" stroke="#5C3B12" stroke-width="4"/>
    <!-- Left Buckle -->
    <rect x="190" y="252" width="32" height="26" rx="6" fill="#F4E8D4" stroke="#5C3B12" stroke-width="4"/>
    <rect x="198" y="258" width="16" height="14" rx="2" fill="#C59458" stroke="#5C3B12" stroke-width="2"/>
    <rect x="204" y="252" width="4" height="26" fill="#5C3B12"/>

    <!-- Right Strap -->
    <rect x="295" y="165" width="22" height="155" rx="8" fill="#C59458" stroke="#5C3B12" stroke-width="4"/>
    <!-- Right Buckle -->
    <rect x="290" y="252" width="32" height="26" rx="6" fill="#F4E8D4" stroke="#5C3B12" stroke-width="4"/>
    <rect x="298" y="258" width="16" height="14" rx="2" fill="#C59458" stroke="#5C3B12" stroke-width="2"/>
    <rect x="304" y="252" width="4" height="26" fill="#5C3B12"/>
  </g>
</svg>
